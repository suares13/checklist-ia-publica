
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.wrap { padding: 1rem 0; }
.dim { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); margin-bottom: 1rem; overflow: hidden; }
.dim-header { padding: 12px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 0.5px solid var(--color-border-tertiary); }
.badge { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 999px; }
.dim-desc { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
.question { display: flex; align-items: flex-start; gap: 12px; padding: 10px 16px; border-bottom: 0.5px solid var(--color-border-tertiary); }
.question:last-child { border-bottom: none; }
.q-text { font-size: 13px; color: var(--color-text-primary); line-height: 1.5; flex: 1; }
.options { display: flex; gap: 6px; flex-shrink: 0; }
.opt { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 0.5px solid var(--color-border-secondary); color: var(--color-text-secondary); background: var(--color-background-secondary); cursor: pointer; transition: all 0.15s; }
.opt:hover { background: var(--color-background-tertiary); }
.opt.sim.active { background: #EAF3DE; color: #27500A; border-color: #97C459; }
.opt.parc.active { background: #FAEEDA; color: #633806; border-color: #EF9F27; }
.opt.nao.active { background: #FCEBEB; color: #791F1F; border-color: #F09595; }
.score-bar { padding: 14px 16px; background: var(--color-background-secondary); display: flex; align-items: center; gap: 16px; }
.score-label { font-size: 13px; color: var(--color-text-secondary); }
.score-val { font-size: 20px; font-weight: 500; color: var(--color-text-primary); min-width: 60px; }
.bar-track { flex: 1; height: 6px; background: var(--color-border-tertiary); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; transition: width 0.3s; }
.status { font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; }
</style>
<div class="wrap">
<div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:10px;">Dimensões baseadas na Recomendação sobre a Ética da Inteligência Artificial (UNESCO, 2021)</div>
<div id="dims"></div>
<div class="dim">
  <div class="score-bar">
    <span class="score-label">Pontuação geral</span>
    <span class="score-val" id="score-val">0/100</span>
    <div class="bar-track"><div class="bar-fill" id="bar" style="width:0%"></div></div>
    <span class="status" id="status-badge" style="background:#F1EFE8;color:#444441">—</span>
  </div>
</div>
</div>

<script>
const dims = [
  {
    id: "transp",
    title: "Transparência",
    desc: "Clareza sobre as regras e o funcionamento do sistema.",
    color: { badge: "#E6F1FB", badgeText: "#0C447C" },
    questions: [
      "O site ou aplicativo possui uma página que explica, em termos simples, para que o sistema serve e como ele funciona?",
      "As regras e critérios utilizados para gerar uma resposta (aprovar ou negar) estão publicados e são fáceis de localizar?",
      "Existe um canal oficial de atendimento (e-mail, telefone ou chat) para tirar dúvidas específicas sobre o uso dessa tecnologia?"
    ]
  },
  {
    id: "explic",
    title: "Explicabilidade",
    desc: "Facilidade para compreender o motivo da decisão recebida.",
    color: { badge: "#EEEDFE", badgeText: "#3C3489" },
    questions: [
      "Quando o sistema emite uma resposta (como aprovar ou negar algo), ele discrimina os motivos exatos daquela decisão?",
      "A justificativa entregue utiliza palavras simples, evitando códigos, termos jurídicos ou jargões técnicos?",
      "O sistema apresenta um passo a passo claro de como o usuário pode recorrer ou contestar o resultado caso não concorde?"
    ]
  },
  {
    id: "vies",
    title: "Justiça e viés",
    desc: "Garantia de que o sistema não discrimina ou exclui grupos sociais.",
    color: { badge: "#FAECE7", badgeText: "#712B13" },
    questions: [
      "O sistema opera com a mesma velocidade e eficiência para usuários de diferentes regiões e municípios?",
      "O serviço oferece opções de análise que não dependam de históricos ou documentos complexos que trabalhadores informais ou de baixa renda têm dificuldade de obter?",
      "Existe um canal ou formulário visível para denunciar ou relatar suspeitas de tratamento injusto e preconceituoso pelo algoritmo?"
    ]
  },
  {
    id: "superv",
    title: "Supervisão humana",
    desc: "Presença de pessoas reais responsáveis pela validação do serviço.",
    color: { badge: "#E1F5EE", badgeText: "#085041" },
    questions: [
      "Se o sistema falhar, travar ou apresentar erro, fica claro para o usuário com quem ele deve falar ou onde pedir suporte humano?",
      "Decisões de alto impacto (como interrupção de benefícios ou aplicação de penalidades) passam pela validação de um funcionário antes de se tornarem definitivas?",
      "O nome do órgão público ou do setor responsável por gerenciar e fiscalizar a ferramenta está visível para a população?"
    ]
  },
  {
    id: "inclusao",
    title: "Inclusão digital",
    desc: "Acessibilidade para usuários com limitações de internet ou dispositivos.",
    color: { badge: "#EAF3DE", badgeText: "#27500A" },
    questions: [
      "O aplicativo ou site carrega rapidamente e funciona sem travamentos em celulares antigos ou conexões de rede limitadas (3G/4G)?",
      "O órgão público oferece uma alternativa presencial ou telefônica síncrona para realizar o mesmo serviço caso o usuário não tenha internet?",
      "A interface cumpre requisitos básicos de acessibilidade, operando corretamente com leitores de tela e comandos assistivos?"
    ]
  }
];

const state = {};

function render() {
  const container = document.getElementById("dims");
  dims.forEach(dim => {
    const card = document.createElement("div");
    card.className = "dim";
    const qs = dim.questions.map((q, qi) => {
      const key = dim.id + "_" + qi;
      state[key] = state[key] || null;
      return `
        <div class="question">
          <span class="q-text">${q}</span>
          <div class="options">
            <button class="opt sim ${state[key]==='sim'?'active':''}" onclick="setOpt('${key}','sim',this)">Sim</button>
            <button class="opt parc ${state[key]==='parc'?'active':''}" onclick="setOpt('${key}','parc',this)">Parcial</button>
            <button class="opt nao ${state[key]==='nao'?'active':''}" onclick="setOpt('${key}','nao',this)">Não</button>
          </div>
        </div>`;
    }).join("");
    card.innerHTML = `
      <div class="dim-header">
        <span class="badge" style="background:${dim.color.badge};color:${dim.color.badgeText}">${dim.title}</span>
        <div class="dim-desc">${dim.desc}</div>
      </div>${qs}`;
    container.appendChild(card);
  });
}

function setOpt(key, val, btn) {
  state[key] = val;
  btn.closest(".options").querySelectorAll(".opt").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  updateScore();
}

function updateScore() {
  let total = 0;
  const keys = Object.keys(state);
  const answered = keys.filter(k => state[k]);
  keys.forEach(k => {
    if (state[k] === "sim") total += 2;
    if (state[k] === "parc") total += 1;
  });
  const max = keys.length * 2;
  const pct = max > 0 ? Math.round((total / max) * 100) : 0;
  document.getElementById("score-val").textContent = pct + "/100";
  document.getElementById("bar").style.width = pct + "%";
  document.getElementById("bar").style.background = pct >= 70 ? "#639922" : pct >= 40 ? "#EF9F27" : "#E24B4A";
  let label = "—", bg = "#F1EFE8", tc = "#444441";
  if (answered.length === keys.length) {
    if (pct >= 70) { label = "Aprovado"; bg = "#EAF3DE"; tc = "#27500A"; }
    else if (pct >= 40) { label = "Alerta"; bg = "#FAEEDA"; tc = "#633806"; }
    else { label = "Falha ética"; bg = "#FCEBEB"; tc = "#791F1F"; }
  } else if (answered.length > 0) {
    label = answered.length + "/" + keys.length + " respondidas";
    bg = "#F1EFE8"; tc = "#444441";
  }
  const badge = document.getElementById("status-badge");
  badge.textContent = label;
  badge.style.background = bg;
  badge.style.color = tc;
}

render();
</script>
